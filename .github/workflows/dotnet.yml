# Este flujo de trabajo construirá un proyecto .NET en Windows y Linux, almacenará los artefactos en carpetas separadas con nombres específicos

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Create artifact folder
      run: |
        mkdir -p OS-linux-osm2vmf/osm2vmf
        cp -r bin/Debug/net8.0/* OS-linux-osm2vmf/osm2vmf/
    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: linux-artifacts
        path: OS-linux-osm2vmf/

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Create artifact folder
      run: |
        mkdir OS-windows-osm2vmf\osm2vmf
        Copy-Item -Recurse -Path "bin/Debug/net8.0/*" -Destination "OS-windows-osm2vmf\osm2vmf\"
    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: windows-artifacts
        path: OS-windows-osm2vmf/
